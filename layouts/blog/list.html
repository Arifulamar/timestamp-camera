{{ define "main" }}
<section class="hero">
<p class="eyebrow">BLOG</p>
<h1>{{ .Title }}</h1>
<p>{{ .Description }}</p>
</section>
<section class="posts">
{{ range .Pages.ByDate.Reverse }}
<article class="post-card">
<p class="date">{{ .Date.Format "2 January 2006" }}</p>
<h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
<p>{{ .Description }}</p>
<a href="{{ .RelPermalink }}">Baca artikel →</a>
</article>
{{ end }}
</section>
{{ end }}
