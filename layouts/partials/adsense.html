{{ $client := .Site.Params.adsenseClient }}
{{ if $client }}
<div class="ad-slot" aria-label="Iklan">
  <ins class="adsbygoogle"
    style="display:block"
    data-ad-client="{{ $client }}"
    data-ad-slot=""
    data-ad-format="auto"
    data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>
{{ end }}
