<!doctype html>
<html lang="{{ .Site.LanguageCode | default "id" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  {{ $description := .Description | default .Site.Params.description }}
  <meta name="description" content="{{ $description }}">
  {{ with .Params.keywords }}<meta name="keywords" content="{{ delimit . ", " }}">{{ end }}
  <meta name="robots" content="{{ if .Draft }}noindex,follow{{ else }}index,follow,max-image-preview:large{{ end }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:description" content="{{ $description }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta name="twitter:card" content="summary">
  {{ if .IsPage }}
  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"Article",
    "headline":{{ .Title | jsonify }},
    "description":{{ $description | jsonify }},
    "datePublished":{{ .Date.Format "2006-01-02T15:04:05Z07:00" | jsonify }},
    "dateModified":{{ (.Lastmod | default .Date).Format "2006-01-02T15:04:05Z07:00" | jsonify }},
    "mainEntityOfPage":{"@type":"WebPage","@id":{{ .Permalink | jsonify }}},
    "author":{"@type":"Organization","name":{{ .Site.Params.author | jsonify }}},
    "publisher":{"@type":"Organization","name":{{ .Site.Params.author | jsonify }}}
  }
  </script>
  {{ end }}
  {{ block "head-extra" . }}{{ end }}
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8942638117851999"
     crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/blog/blog.css">
</head>
<body>
<header class="blog-header">
  <div class="blog-shell blog-nav">
    <a class="blog-brand" href="/blog/">Kamera Timestamp</a>
    <nav aria-label="Navigasi blog">
      <a href="/">Kamera</a>
      <a href="/blog/">Blog</a>
    </nav>
  </div>
</header>
<main class="blog-shell">
  {{ block "main" . }}{{ end }}
</main>
<footer class="blog-footer">
  <div class="blog-shell">© {{ now.Year }} Kamera Timestamp</div>
</footer>
</body>
</html>
