name: Deploy site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Build Hugo blog
        run: hugo --minify

      - name: Merge existing camera app
        run: |
          cp index.html public/index.html
          cp app.js public/app.js
          cp styles.css public/styles.css
          cp style.css public/style.css
          cp sw.js public/sw.js
          cp manifest.webmanifest public/manifest.webmanifest
          cp icon-192.png public/icon-192.png
          cp icon-512.png public/icon-512.png
          cp CNAME public/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
